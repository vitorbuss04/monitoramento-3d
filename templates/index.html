<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag viewport essencial para responsividade no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento Impressão 3D</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Mantém a proporção 16:9 da câmera */
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 0.5rem;
        }
        .video-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <div class="max-w-4xl mx-auto p-4 md:p-6">
        <!-- Cabeçalho -->
        <header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-gray-900 text-center sm:text-left">Monitor de Impressão 3D</h1>
            <div id="status-badge" class="px-3 py-1 rounded-full text-sm font-semibold bg-gray-200 text-gray-700">
                Aguardando status...
            </div>
        </header>

        <main class="space-y-6">
            <!-- Container da Câmera -->
            <div class="bg-white rounded-xl shadow-md p-4">
                <h2 class="text-lg font-semibold mb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Feed ao Vivo
                </h2>
                
                {% if camera_configured %}
                <div class="video-container shadow-sm border border-gray-200">
                    <img src="/video_feed" alt="Câmera IP Webcam" id="cam-image" 
                         onerror="this.onerror=null; this.alt='Câmera offline. Verifique se o IP Webcam está rodando no celular e se o IP do Tailscale no .env está correto.';">
                </div>
                {% else %}
                <div class="bg-red-50 p-4 rounded-lg text-red-700 border border-red-200 text-sm">
                    ⚠️ URL da câmera não configurada. Renomeie o arquivo <b>.env.example</b> para <b>.env</b> e configure o IP.
                </div>
                {% endif %}
            </div>

            <!-- Card de Status da Inteligência Artificial -->
            <div class="bg-white rounded-xl shadow-md p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-semibold flex items-center">
                        <svg class="w-5 h-5 mr-2 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        Inteligência Artificial (Gemini)
                    </h2>
                    <button id="btn-force-check" onclick="forceCheck()" class="text-xs bg-purple-600 hover:bg-purple-700 text-white font-semibold py-1.5 px-3 rounded shadow transition-colors">
                        Verificar Agora
                    </button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-gray-50 rounded-lg p-3 border border-gray-100">
                        <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Última Checagem</p>
                        <p id="last-time" class="font-semibold text-gray-900">-</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-3 border border-gray-100">
                        <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Status / Motivo</p>
                        <p id="last-reason" class="text-sm font-medium text-gray-900">-</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('last-time').textContent = data.last_check_time;
                    
                    const reasonElement = document.getElementById('last-reason');
                    reasonElement.textContent = data.last_check_status;
                    
                    const badge = document.getElementById('status-badge');
                    
                    if (data.is_failing) {
                        badge.innerHTML = '<span class="flex items-center"><span class="w-2 h-2 bg-red-600 rounded-full mr-2 animate-ping"></span> Falha Detectada!</span>';
                        badge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-700 border border-red-300';
                        reasonElement.className = 'text-sm font-bold text-red-600';
                    } else if (data.last_check_time !== 'Nenhuma') {
                        badge.innerHTML = '<span class="flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> Monitorando</span>';
                        badge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-green-50 text-green-700 border border-green-200';
                        reasonElement.className = 'text-sm font-medium text-gray-900';
                    }
                })
                .catch(err => console.error('Erro ao buscar status da IA:', err));
        }

        function forceCheck() {
            const btn = document.getElementById('btn-force-check');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Analisando...';
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            fetch('/force_check', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    updateStatus(); // Atualiza a tela imediatamente com o novo resultado
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                })
                .catch(err => {
                    console.error('Erro:', err);
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    alert("Falha ao solicitar análise manual.");
                });
        }

        // Atualiza os dados a cada 30 segundos
        setInterval(updateStatus, 30000);
        
        // Faz a primeira checagem assim que a página carrega
        updateStatus();
    </script>
</body>
</html>
